# Local PostgreSQL, S3-compatible object store and collector migration (credentials are local-only)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: doclens
      POSTGRES_USER: doclens
      POSTGRES_PASSWORD: doclens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "doclens", "-d", "doclens"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: doclens
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 2s
      timeout: 5s
      retries: 30

  collector-migrate:
    image: flyway/flyway:12.11.0
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./collector/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/doclens
      - -user=doclens
      - -password=doclens
      - -schemas=collector
      - -defaultSchema=collector
      - -createSchemas=true
      - -locations=filesystem:/flyway/sql
      - -cleanDisabled=true
      - -validateMigrationNaming=true
      - migrate
      - validate

volumes:
  postgres-data:
  s3mock-data:
