[project]
name = "doclens-collector"
version = "0.1.0"
description = "DocLens document collector"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.44.9",
    "jsonschema==4.26.0",
    "protego==0.7.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "urllib3>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "testcontainers==4.15.0",
    "trustme==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not external'"
markers = [
    "external: real external calls, run on demand with -m external",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
